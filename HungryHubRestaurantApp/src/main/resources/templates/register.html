<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Hungry Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
       /* =========================
   GLOBAL RESET
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #ffe6e1, #ffd2a6);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   REGISTRATION CONTAINER
========================= */
.RegistrationContainer {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 50px 20px;
}

/* =========================
   REGISTRATION FORM CARD
========================= */
.registration {
    background: #fff7f5;
    border-radius: 25px;
    padding: 40px 30px;
    width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.registration:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

/* =========================
   HEADER
========================= */
.registration h2 {
    text-align: center;
    color: #ff6a88;
    font-size: 2rem;
    margin-bottom: 25px;
    letter-spacing: 1px;
}

/* =========================
   LABELS
========================= */
.registration label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
    color: #ff6a88;
}

/* =========================
   INPUT FIELDS
========================= */
.registration input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border: 1px solid #ff9a8b;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
    transition: all 0.3s ease;
}

.registration input:focus {
    border-color: #ff6a88;
    box-shadow: 0 0 8px rgba(255,106,136,0.5);
}

/* =========================
   SUBMIT BUTTON
========================= */
.registration button {
    width: 100%;
    padding: 12px 0;
    background: #ff6a88;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.registration button:hover {
    background: #ff9a8b;
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(255,106,136,0.4);
}

/* =========================
   ERROR MESSAGE
========================= */
.registration p {
    text-align: center;
    color: crimson;
    font-weight: 500;
    margin-top: -10px;
}

/* =========================
   RESPONSIVE DESIGN
========================= */
@media (max-width: 480px) {
    .registration {
        width: 90%;
        padding: 30px 20px;
    }

    .registration h2 {
        font-size: 1.8rem;
    }

    .registration input {
        font-size: 14px;
        padding: 10px;
    }

    .registration button {
        font-size: 15px;
        padding: 10px 0;
    }
}

    </style>
</head>

<body>
    <div class="RegistrationContainer">
        <div class="registration">
            <div class="content">
                <h2>Register</h2>

            <form th:action="@{/register}" method="post" th:object="${user}">
				    <label for="u_id">UserID:</label>
                    <input type="text" id="u_id" name="u_id" th:field="*{u_id}" required><br>
                    
                    <label for="uemail">Email:</label>
                    <input type="email" id="uemail" name="uemail" th:field="*{uemail}" required><br>

                    <label for="uname">Username:</label>
                    <input type="text" id="uname" name="uname" th:field="*{uname}" required><br>

                    <label for="unumber">Phone Number:</label>
                    <input type="text" id="unumber" name="unumber" th:field="*{unumber}" required><br>

                    <label for="upassword">Password:</label>
                    <input type="password" id="upassword" name="upassword" th:field="*{upassword}" required><br>

                    <button type="submit">Register</button>
                </form>


                <p th:text="${error}" style="color: red;"></p>
            </div>
        </div>
    </div>
</body>

</html>
