<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.com">

<head>
	<meta charset="UTF-8" />
	<title>Buy Product </title>
	<link rel="stylesheet" href="" />
</head>
<style>
	/* =========================
   GLOBAL RESET
========================= */
* {
    font-size: 16px;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* =========================
   BODY & BACKGROUND
========================= */
body {
    background-image: url("https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #333;
    min-height: 100vh;
    padding: 20px;
}

/* =========================
   SEARCH INPUT
========================= */
.searchInput {
    margin: 30px auto;
    text-align: center;
}

.searchInput input {
    padding: 15px 20px;
    width: 280px;
    border-radius: 25px;
    border: 2px solid #ff6a88;
    outline: none;
    font-size: 16px;
    transition: all 0.3s ease;
}

.searchInput input:focus {
    border-color: #ff9a8b;
    box-shadow: 0 0 8px rgba(255,106,136,0.5);
}

.searchInput button {
    padding: 15px 25px;
    width: 120px;
    border-radius: 25px;
    border: none;
    background: #ff6a88;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-left: 10px;
}

.searchInput button:hover {
    background: #ff9a8b;
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(255,106,136,0.4);
}

/* =========================
   DETAILS TABLE
========================= */
.details {
    margin-top: 50px;
    width: 90%;
    margin-left: auto;
    margin-right: auto;
    overflow-x: auto;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    padding: 20px;
}

.details th {
    background-color: #ff6a88;
    color: #fff;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
}

.details td {
    text-align: center;
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.details input,
.details button {
    display: block;
    width: 90%;
    margin: 10px auto;
    padding: 10px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ff6a88;
    outline: none;
    transition: all 0.3s ease;
}

.details input:focus {
    border-color: #ff9a8b;
    box-shadow: 0 0 8px rgba(255,106,136,0.5);
}

.details button {
    background-color: #ff6a88;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    border: none;
}

.details button:hover {
    background-color: #ff9a8b;
    transform: scale(1.05);
}

/* =========================
   LINKS
========================= */
a {
    border: 1px solid #ff6a88;
    background-color: #fff3f2;
    color: #ff6a88;
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 8px;
    transition: all 0.3s ease;
    position: fixed;
    top: 20px;
    left: 20px;
}

a:hover {
    background-color: #ff6a88;
    color: #fff;
    transform: scale(1.1);
}

/* =========================
   WELCOME MESSAGE
========================= */
.welcome marquee, .welcome span {
    display: block;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    margin-bottom: 20px;
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 768px) {
    .searchInput input {
        width: 70%;
    }

    .searchInput button {
        width: 90px;
        padding: 12px;
    }

    .details td, .details th {
        padding: 8px;
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .details {
        width: 100%;
        padding: 10px;
    }

    .searchInput input {
        width: 60%;
    }

    .searchInput button {
        width: 80px;
    }
}

	
</style>

<body>
	<div class="welcome">
			<marquee direction="right"  behaviour="slide" 
			scrollamount="15" loop="1">Welcome Back <span  th:text="${name}"></span>
			</marquee><br />
	</div>
	
	<a href="/login">Back</a>
	<center>

		<form action="" th:action="@{/product/search}" method="post" class="searchInput">
			<h1>Product Search :</h1>
			<input type="text" name="productName" required placeholder="Please enter the Product Name....">
			<button type="submit">SEARCH</button><br />
			<smal style="color: red;" th:text="${message}"> </smal>
		</form>
		
		<div th:if="${product!=null}" class="details">
			<form action="" th:action="@{/product/order}" th:object="${product}" method="post">
				ProductName :
				<input type="text" value="" name="oName" th:value="${product.pname}" readonly /><br />
				Product Price :
				<input type="text" value="" name="oPrice" th:value="${product.pprice}" readonly /><br />
				Quqntity :
				<input type="number" placeholder="Minimun: 1Quantity" min="1" name="oQuantity" /><br />

				<button type="submit">Order_Now</button>
			</form>
		</div>
		
		<div th:if="${orders!=null}" class="details">
			<h2>Your Orders :</h2>
			<table >
				<tr>
	
					<th>Product_Name</th>
					<th>Product_Price</th>
					<th>Product_Quantity</th>
					<th>Total_Ammount</th>
					<th>Date</th>
				</tr>
				<tr th:each="order :${orders}">
					<td th:text="${order.oName}"></td>
					<td th:text="${order.oPrice}"></td>
					<td th:text="${order.oQuantity}"></td>
					<td th:text="${order.totalAmmout}"></td>
					<td th:text="${order.orderDate}"></td>

				</tr>
			</table>
		</div>
	</center>
</body>

</html>
